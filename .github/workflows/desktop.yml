name: Desktop release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs'
          const read = path => readFileSync(path, 'utf8')
          const version = JSON.parse(read('src-tauri/tauri.conf.json')).version
          const versions = [
            JSON.parse(read('package.json')).version,
            JSON.parse(read('package-lock.json')).packages[''].version,
            read('src-tauri/Cargo.toml').match(/^version = "([^"]+)"/m)?.[1],
          ]
          if (!versions.every(value => value === version)) {
            throw new Error('Desktop and npm versions must match')
          }
          JS
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install chromium
      - run: npm run test:ui
      - run: cargo install tauri-cli --version '^2' --locked
      - run: npm run build
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Verify installer
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" = 1
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${images[0]}"
          trap 'hdiutil detach "$mount_dir" && rmdir "$mount_dir"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Pingboard.app"
          mkdir installers
          version="$(jq -er .version src-tauri/tauri.conf.json)"
          cp "${images[0]}" "installers/Pingboard-${version}-macOS-Apple-Silicon.dmg"
          (cd installers && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Pingboard-macOS-Apple-Silicon
          path: installers/
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pingboard-macOS-Apple-Silicon
          path: installers
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          (cd installers && sha256sum --check SHA256SUMS.txt)
          tag="v$(jq -er .version src-tauri/tauri.conf.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          notes=$(mktemp)
          awk -v tag="$tag" '$0 == "## " tag {active=1; next} /^## / && active {exit} active {print}' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "Pingboard $tag" --notes-file "$notes"
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "Pingboard $tag" --generate-notes
          fi
